name: Feature request
description: 建议新的功能或工作流改进
title: "[Feature]: "
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: 要解决的问题
      description: 请描述当前工作流中的限制或困难。
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: 建议方案
      description: 请说明期望的交互方式或结果。
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: 替代方案
      description: 是否考虑过其他实现或临时解决办法？
  - type: textarea
    id: context
    attributes:
      label: 补充信息
      description: 可添加示例、截图或相关链接。
